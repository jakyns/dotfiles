---
- name: install ruby
  command: mise install ruby@{{ item }}
  with_items: "{{ ruby_versions }}"

- meta: flush_handlers

- name: install ruby packages
  gem:
    name: "{{ item }}"
    state: present
    user_install: false
    executable: ~/.local/share/mise/shims/gem
  with_items: "{{ gem_packages }}"
  notify: update shims

- name: initial bundle folder
  file:
    path: ~/.bundle
    state: directory

- name: copy bundle config
  copy:
    src: files/ruby/bundle/config
    dest: ~/.bundle
    force: yes
