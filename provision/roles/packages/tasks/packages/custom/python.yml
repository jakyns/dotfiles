---
- name: install python
  command: mise install python@{{ item }}
  with_items: "{{ python_versions }}"
  notify:
    - update shims

- meta: flush_handlers

- name: install python packages
  command: ~/.local/share/mise/installs/python/{{ default_python_version }}/bin/pip install {{ pip_packages | join(' ') }}
  notify: update shims
