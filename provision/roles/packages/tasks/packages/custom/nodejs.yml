---
- name: install nodejs
  command: mise install node@{{ item }}
  with_items: "{{ nodejs_versions }}"

- meta: flush_handlers

- name: install yarn
  homebrew:
    name: yarn
    state: present
  notify: update shims

- meta: flush_handlers

- name: install yarn packages
  yarn:
    name: "{{ item }}"
    state: present
    global: true
  with_items: "{{ yarn_packages }}"
  notify: update shims
