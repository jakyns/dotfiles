---
- name: install claude
  homebrew_cask:
    name: claude
    state: present

- name: install claude code
  homebrew_cask:
    name: claude-code
    state: present

- name: install rtk
  homebrew:
    name: rtk
    state: present

- name: set up rtk for claude code
  command: rtk init -g --auto-patch
  args:
    creates: ~/.claude/RTK.md

- name: install claude skills
  command: mise exec node@{{ default_nodejs_version }} -- npx -y skills add {{ item.0.source }} --skill {{ item.1 }} --global --agent claude-code --yes
  args:
    creates: ~/.claude/skills/{{ item.1 }}
  loop: "{{ claude_skills | subelements('names') }}"
  loop_control:
    label: "{{ item.0.source }}/{{ item.1 }}"
