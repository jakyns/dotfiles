---
- name: create parent directories for links
  file:
    path: "{{ item }}"
    state: directory
  loop: "{{ links | map(attribute='dest') | map('dirname') | unique }}"

- name: link files and directories
  file:
    src: "{{ item.source }}"
    path: "{{ item.dest }}"
    state: link
    force: yes
    follow: false
  with_items: "{{ links }}"
